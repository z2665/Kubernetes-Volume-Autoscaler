name: Docker Image CI

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: 1.0.9

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kubernetes-volume-autoscaler
  IMAGE_TAG: ${{ inputs.tag || 'latest' }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python source
        run: |
          python3 -m venv /tmp/volume-autoscaler-venv
          /tmp/volume-autoscaler-venv/bin/pip install --no-cache-dir bandit
          /tmp/volume-autoscaler-venv/bin/bandit -r . -x ./helm-chart,./examples
          python3 -m compileall -q main.py helpers.py slack.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and verify each architecture
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            image="${IMAGE_NAME}:${IMAGE_TAG}-${arch}"
            docker buildx build --platform "linux/${arch}" --load --provenance=false --sbom=false -t "$image" .
            docker run --rm --platform "linux/${arch}" --entrypoint python "$image" \
              -c 'import kubernetes, packaging, prometheus_client, requests; print("dependency imports passed")'
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache:/root/.cache" \
              aquasec/trivy:0.76.2 image \
              --exit-code 1 --scanners vuln --pkg-types os,library \
              --severity HIGH,CRITICAL "$image"
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push --provenance=false --sbom=false -t "${IMAGE_NAME}:${IMAGE_TAG}" .
